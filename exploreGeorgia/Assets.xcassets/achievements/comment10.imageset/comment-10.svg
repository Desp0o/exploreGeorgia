<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#4682B4"/>
  <circle cx="100" cy="100" r="85" fill="#6495ED"/>
  
  <!-- Speech bubble -->
  <path d="M60 70 
           L140 70
           Q150 70 150 80
           L150 120
           Q150 130 140 130
           L110 130
           L100 145
           L90 130
           L60 130
           Q50 130 50 120
           L50 80
           Q50 70 60 70Z" 
        fill="#FFFFFF"/>
  
  <!-- Number -->
  <text x="100" y="110" 
        font-family="Arial, sans-serif" 
        font-size="30" 
        fill="#4682B4" 
        text-anchor="middle" 
        font-weight="bold">10</text>
  
  <!-- Text -->
  <text x="100" y="160" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        fill="#FFFFFF" 
