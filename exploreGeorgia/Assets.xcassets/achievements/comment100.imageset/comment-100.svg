<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#9370DB"/>
  <circle cx="100" cy="100" r="85" fill="#8A2BE2"/>
  
  <!-- Multiple speech bubbles -->
  <path d="M50 90 
           L100 90
           Q110 90 110 100
           L110 120
           Q110 130 100 130
           L80 130
           L70 140
           L60 130
           L50 130
           Q40 130 40 120
           L40 100
           Q40 90 50 90Z" 
        fill="#FFFFFF"/>
        
  <path d="M90 60 
           L140 60
           Q150 60 150 70
           L150 90
           Q150 100 140 100
           L120 100
           L110 110
           L100 100
           L90 100
           Q80 100 80 90
           L80 70
           Q80 60 90 60Z" 
        fill="#FFFFFF" opacity="0.9"/>
        
  <!-- Number -->
  <text x="100" y="110" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        fill="#9370DB" 
        text-anchor="middle" 
        font-weight="bold">100</text>
  
  <!-- Text -->
  <text x="100" y="160" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        font-weight="bold">CONVERSATION MASTER</text>
</svg>
