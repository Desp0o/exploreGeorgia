<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FFD700"/>
  <circle cx="100" cy="100" r="85" fill="#DAA520"/>
  
  <!-- Decorative border -->
  <path d="M100 20 A80 80 0 0 1 180 100" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,5"/>
  <path d="M20 100 A80 80 0 0 1 100 20" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,5"/>
  <path d="M100 180 A80 80 0 0 1 20 100" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,5"/>
  <path d="M180 100 A80 80 0 0 1 100 180" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Multiple speech bubbles with connection lines -->
  <path d="M40 100 
           L90 100
           Q100 100 100 110
           L100 130
           Q100 140 90 140
           L70 140
           L60 150
           L50 140
           L40 140
           Q30 140 30 130
           L30 110
           Q30 100 40 100Z" 
        fill="#FFFFFF"/>
        
  <path d="M80 70 
           L130 70
           Q140 70 140 80
           L140 100
           Q140 110 130 110
           L110 110
           L100 120
           L90 110
           L80 110
           Q70 110 70 100
           L70 80
           Q70 70 80 70Z" 
        fill="#FFFFFF" opacity="0.9"/>
        
  <path d="M110 40 
           L160 40
           Q170 40 170 50
           L170 70
           Q170 80 160 80
           L140 80
           L130 90
           L120 80
           L110 80
           Q100 80 100 70
           L100 50
           Q100 40 110 40Z" 
        fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Connecting lines -->
  <path d="M90 80 L110 100" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M70 110 L90 130" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Number -->
  <text x="100" y="110" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        fill="#B8860B" 
        text-anchor="middle" 
        font-weight="bold">1000</text>
  
  <!-- Text -->
  <text x="100" y="160" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        font-weight="bold">COMMUNITY LEGEND</text>
</svg>
